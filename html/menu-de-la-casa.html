<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú de la casa Pizza Pacho</title>

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/menus-especificos.css">
    <link rel="shortcut icon" href="../img/logo.jpg" type="image/x-icon">
</head>

<body>
    <h1 class="titulo-secundario">Menú de la casa</h1>

    <section class="menu-especifico">
        <div class="item-menu"><img src="../img/camionera.jpg" alt="Combo Pacho" class="img-item-menu">
            <div class="textos">
                <p class="precio">28.000</p>
                <p class="ingredientes">Hamburguesa especial, papas a la francesa y bebida.</p>
            </div>
        </div>
        <div class="item-menu"><img src="../img/camionera.jpg" alt="Combo familiar" class="img-item-menu">
            <div class="textos">
                <p class="precio">42.000</p>
                <p class="ingredientes">Dos hamburguesas, papas para compartir y dos bebidas.</p>
            </div>
        </div>
        <div class="item-menu"><img src="../img/camionera.jpg" alt="Pacho mix" class="img-item-menu">
            <div class="textos">
                <p class="precio">30.000</p>
                <p class="ingredientes">Papas, pollo, carne, salchicha, queso y salsas de la casa.</p>
            </div>
        </div>
        <div class="item-menu"><img src="../img/camionera.jpg" alt="Picada Pacho" class="img-item-menu">
            <div class="textos">
                <p class="precio">36.000</p>
                <p class="ingredientes">Carne, pollo, chorizo, papas, arepa y salsas.</p>
            </div>
        </div>
    </section>
</body>

</html>
