<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dorilocos Pizza Pacho</title>

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/menus-especificos.css">
    <link rel="shortcut icon" href="../img/logo.jpg" type="image/x-icon">
</head>

<body>
    <h1 class="titulo-secundario">Dorilocos Pizza Pacho</h1>

    <section class="menu-especifico">
        <div class="item-menu"><img src="../img/camionera.jpg" alt="Doriloco clásico" class="img-item-menu">
            <div class="textos">
                <p class="precio">12.000</p>
                <p class="ingredientes">Doritos, salchicha, queso, maíz, papas y salsas de la casa.</p>
            </div>
        </div>
        <div class="item-menu"><img src="../img/camionera.jpg" alt="Doriloco con pollo" class="img-item-menu">
            <div class="textos">
                <p class="precio">16.000</p>
                <p class="ingredientes">Doritos, pollo desmechado, queso, maíz, papas y salsas.</p>
            </div>
        </div>
        <div class="item-menu"><img src="../img/camionera.jpg" alt="Doriloco ranchero" class="img-item-menu">
            <div class="textos">
                <p class="precio">17.000</p>
                <p class="ingredientes">Doritos, carne, salchicha, tocineta, queso y salsas.</p>
            </div>
        </div>
        <div class="item-menu"><img src="../img/camionera.jpg" alt="Doriloco especial" class="img-item-menu">
            <div class="textos">
                <p class="precio">20.000</p>
                <p class="ingredientes">Doritos, carne, pollo, salchicha, queso, maíz y salsas.</p>
            </div>
        </div>
    </section>

</html>
